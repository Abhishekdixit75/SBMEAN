<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Basics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    #output {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>JavaScript Basics</h1>
  <p>Click the button to run a function.</p>
  <button id="showBtn">Click Me</button>
  <p id="output"></p>

  <script>
    const appName = "JS Basics Demo";
    let userName = "Student";
    let clickCount = 0;

    function showMessage() {
      clickCount++;
      let message = "Hello, " + userName + "! " + appName + " clicked " + clickCount + " time(s).";
      document.getElementById("output").textContent = message;
    }

    document.getElementById("showBtn").addEventListener("click", showMessage);
    document.getElementById("showBtn").addEventListener("mouseover", function () {
      document.getElementById("output").textContent = "Mouse is over the button.";
    });
  </script>
</body>
</html>

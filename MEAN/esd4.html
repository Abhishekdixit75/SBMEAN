<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">My Site</a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-3">Bootstrap Components</h1>

    <div class="alert alert-success" role="alert">
      This is a Bootstrap alert component.
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title">Card Component</h2>
        <p class="card-text">Simple example of a Bootstrap card.</p>
        <button class="btn btn-primary">Click</button>
      </div>
    </div>

    <h2 class="h5 mb-3">Bootstrap Grid System</h2>
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="p-3 bg-primary text-white text-center rounded">Column 1</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="p-3 bg-secondary text-white text-center rounded">Column 2</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="p-3 bg-success text-white text-center rounded">Column 3</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

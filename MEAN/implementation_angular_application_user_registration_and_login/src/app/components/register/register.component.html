<!--
About: Registration form template bound with ngModel and submit handler.
Run: Use Angular CLI (`ng serve`) from the project root.
-->
<h2>Register</h2>
<form (ngSubmit)="onRegister()" #registerForm="ngForm">
  <input
    type="text"
    name="name"
    [(ngModel)]="name"
    placeholder="Name"
    required
  />
  <input
    type="email"
    name="email"
    [(ngModel)]="email"
    placeholder="Email"
    required
  />
  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    placeholder="Password"
    required
  />
  <button type="submit">Register</button>
</form>
<p>{{ message }}</p>

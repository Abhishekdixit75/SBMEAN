<!--
About: Login form template bound with ngModel and submit handler.
Run: Use Angular CLI (`ng serve`) from the project root.
-->
<h2>Login</h2>
<form (ngSubmit)="onLogin()" #loginForm="ngForm">
  <input
    type="email"
    name="email"
    [(ngModel)]="email"
    placeholder="Email"
    required
  />
  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    placeholder="Password"
    required
  />
  <button type="submit">Login</button>
</form>
<p>{{ message }}</p>

<!doctype html>
<!--
About: JSON stringify/parse with a sample object and DOM output.
Run: Open in a browser to see the parsed values and JSON text.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON Data Handling</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      pre {
        background: #f4f4f4;
        padding: 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>JSON Data Handling</h1>
    <p id="result"></p>
    <pre id="jsonText"></pre>

    <script>
      const student = {
        id: 1,
        name: "Rahul",
        course: "Web Development",
      };

      const jsonString = JSON.stringify(student);
      const parsedData = JSON.parse(jsonString);

      document.getElementById("result").textContent =
        "Name: " + parsedData.name + ", Course: " + parsedData.course;
      document.getElementById("jsonText").textContent = jsonString;
    </script>
  </body>
</html>

<!doctype html>
<!--
About: Shows CSS flexbox, grid, transitions, and keyframe animation in one page.
Run: Open in a browser and interact with the hover/animation elements.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Styling Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      h2 {
        margin-top: 30px;
      }

      .box {
        background: #0d6efd;
        color: #fff;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }

      .flex-container {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .flex-container .box {
        flex: 1 1 120px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .transition-box {
        width: 140px;
        background: #198754;
        transition:
          transform 0.3s ease,
          background 0.3s ease;
        cursor: pointer;
      }

      .transition-box:hover {
        transform: scale(1.1);
        background: #157347;
      }

      .animated-box {
        width: 80px;
        margin-top: 10px;
        animation: moveSide 2s infinite alternate ease-in-out;
      }

      @keyframes moveSide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(120px);
        }
      }
    </style>
  </head>
  <body>
    <h1>CSS Styling</h1>

    <section>
      <h2>Flexbox</h2>
      <div class="flex-container">
        <div class="box">Item 1</div>
        <div class="box">Item 2</div>
        <div class="box">Item 3</div>
      </div>
    </section>

    <section>
      <h2>Grid</h2>
      <div class="grid-container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
      </div>
    </section>

    <section>
      <h2>Transition</h2>
      <div class="box transition-box">Hover Me</div>
    </section>

    <section>
      <h2>Animation</h2>
      <div class="box animated-box">Move</div>
    </section>
  </body>
</html>

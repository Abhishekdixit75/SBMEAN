<!doctype html>
<!--
About: Mobile-first responsive layout with tablet and desktop breakpoints.
Run: Open in a browser and resize the viewport to see the layout adapt.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile-First Design</title>
    <style>
      /* Mobile-first base styles */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      .container {
        padding: 16px;
      }

      .card {
        background: #fff;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 14px;
      }

      /* Tablet and above */
      @media (min-width: 768px) {
        .container {
          max-width: 900px;
          margin: 0 auto;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }

        h1 {
          font-size: 1.8rem;
        }
      }

      /* Desktop and above */
      @media (min-width: 1024px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Mobile-First Responsive Design</h1>
      <div class="grid">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
      </div>
    </div>
  </body>
</html>

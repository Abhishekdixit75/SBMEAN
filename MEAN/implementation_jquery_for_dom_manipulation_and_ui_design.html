<!doctype html>
<!--
About: jQuery DOM manipulation, class toggles, slide effects, and list updates.
Run: Open in a browser with internet access (uses jQuery CDN).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jQuery DOM and UI</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      .card {
        max-width: 460px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fafafa;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }

      button {
        padding: 7px 10px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      #box {
        margin-top: 12px;
        padding: 12px;
        border-radius: 6px;
        background: #e9ecef;
      }

      .highlight {
        background: #ffe8a3 !important;
        color: #222;
        font-weight: bold;
      }

      ul {
        margin-top: 10px;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <h1>jQuery Demo</h1>

    <div class="card">
      <p id="message">This is a sample text.</p>

      <div class="controls">
        <button id="changeTextBtn" type="button">Change Text</button>
        <button id="toggleStyleBtn" type="button">Toggle Style</button>
        <button id="toggleBoxBtn" type="button">Show / Hide Box</button>
        <button id="addItemBtn" type="button">Add List Item</button>
      </div>

      <div id="box">I am a box manipulated using jQuery effects.</div>
      <ul id="itemList">
        <li>Item 1</li>
      </ul>
    </div>

    <script>
      $(document).ready(function () {
        let itemCount = 1;

        $("#changeTextBtn").on("click", function () {
          $("#message").text("Text changed using jQuery.");
        });

        $("#toggleStyleBtn").on("click", function () {
          $("#message").toggleClass("highlight");
        });

        $("#toggleBoxBtn").on("click", function () {
          $("#box").slideToggle(200);
        });

        $("#addItemBtn").on("click", function () {
          itemCount++;
          $("#itemList").append("<li>Item " + itemCount + "</li>");
        });
      });
    </script>
  </body>
</html>

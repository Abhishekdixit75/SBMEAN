<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - 3 Tier Demo</title>
</head>
<body>

    <h2>Add New Student</h2>
    <div>
        <label>Name:</label>
        <input type="text" id="name">
    </div>
    <div>
        <label>Email:</label>
        <input type="email" id="email">
    </div>
    <div>
        <label>Course:</label>
        <input type="text" id="course">
    </div>
    <button onclick="addStudent()">Register Student</button>

    <hr>

    <h2>Student List</h2>
    <button onclick="fetchStudents()">Refresh List</button>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Data will be populated here -->
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
